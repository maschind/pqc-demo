# cp ai-secrets.example.yaml ai-secrets.yaml  (git-ignored)
# oc apply -n <username>-devspaces -f ai-secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: ai-env
  labels:
    controller.devfile.io/mount-to-devworkspace: "true"
    controller.devfile.io/watch-secret: "true"
  annotations:
    controller.devfile.io/mount-as: env
type: Opaque
stringData:
  OPENROUTER_API_KEY: ""
  # Claude Code: pick ONE option. Do NOT add empty Claude keys, because an empty
  # ANTHROPIC_API_KEY can interfere with the extension's normal login.
  # A) ANTHROPIC_API_KEY: "sk-ant-..."
  # B) Vertex: CLAUDE_CODE_USE_VERTEX: "1", CLOUD_ML_REGION: "us-east5",
  #    ANTHROPIC_VERTEX_PROJECT_ID: "<proj>",
  #    GOOGLE_APPLICATION_CREDENTIALS: "/etc/claude-vertex/credentials.json"
  #    (plus a second Secret, mount-as: subpath, mount-path: /etc/claude-vertex)
  # C) Gateway: ANTHROPIC_BASE_URL: "https://...", ANTHROPIC_AUTH_TOKEN: "..."
