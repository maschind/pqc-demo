# Java 17 Spring Boot 2.7 — Enterprise HTTPS Crypto Demo
spring.application.name=pqc-demo

# HTTPS Configuration — self-signed certificate, TLS 1.2 only
server.port=8443
server.ssl.key-store=file:tls/server-keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.enabled-protocols=TLSv1.2

# Keystore properties for CryptoCapabilitiesService
app.keystore.path=tls/server-keystore.p12
app.keystore.password=changeit
app.keystore.alias=server

# Logging
logging.level.com.example.pqcdemo=DEBUG
